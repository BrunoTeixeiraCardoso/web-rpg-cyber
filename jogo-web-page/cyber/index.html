<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site oficial do RPG de mesa cyberpunk e distópico: Protocolo Neon. Baixe o manual rápido.">
    <title>Protocolo Neon | RPG Cyberpunk de Mesa</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Arquivo de Estilos (Apresentação) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="#main-content" class="skip-link">Ir para a rede principal</a>

    <header class="header">
        <div class="header__container">
            <span id="js-logo" class="header__logo"></span>
            <nav class="header__nav" aria-label="Navegação do Sistema">
                <ul id="js-menu" class="header__menu"></ul>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <section class="hero" aria-labelledby="hero-title">
            <div class="hero__container">
                <h1 id="js-hero-title" class="hero__title"></h1>
                <p id="js-hero-subtitle" class="hero__subtitle"></p>
                <div class="hero__actions">
                    <a id="js-hero-primary" href="" class="btn btn--primary"></a>
                    <a id="js-hero-secondary" href="" class="btn btn--secondary"></a>
                </div>
            </div>
        </section>

        <div class="layout-container">
            <section id="about" class="section" aria-labelledby="about-title">
                <h2 id="js-about-title" class="section__title"></h2>
                <div class="section__content">
                    <p id="js-about-text"></p>
                </div>
            </section>

            <section id="features" class="section" aria-labelledby="features-title">
                <h2 id="js-features-title" class="section__title"></h2>
                <p id="js-features-intro" class="section__intro"></p>
                <div id="js-grid" class="grid"></div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="footer__container">
            <p id="js-footer-copyright" class="footer__copyright"></p>
            <p id="js-footer-meta" class="footer__meta"></p>
        </div>
    </footer>

    <!-- Arquivo de Comportamento (Lógica e Injeção de Dados) -->
    <script src="app.js" defer></script>
</body>
</html>
